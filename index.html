<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขออนุญาตออกก่อนเวลาราชการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
        .form-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-md mx-auto bg-white rounded-2xl overflow-hidden form-card">
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-semibold">ขออนุญาตออกก่อนเวลา</h1>
            <p class="text-blue-100 text-sm mt-1">กรุณากรอกข้อมูลให้ครบถ้วนเพื่อส่งคำขอ</p>
        </div>

        <form id="leaveForm" class="p-6 space-y-4">
            <!-- วันที่ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">วันที่</label>
                <input type="date" name="date" id="inputDate" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>

            <!-- ชื่อ-สกุล -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <input list="nameList" name="fullName" placeholder="เลือกหรือพิมพ์ชื่อ-นามสกุล" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                <datalist id="nameList">
                    <option value="นายนิชาฟีอี หะยีแวสามะ">
                    <option value="นายทวีวัฒน์ ทองคำ">
                    <option value="นางนอร์อัยนี หะยีแวสามะ">
                    <option value="นางคอซัยหม๊ะ ตาเละ">
                    <option value="นางมยุรี ลีกี">
                    <option value="นายอรุณศักดิ์ มะเกะ">
                    <option value="นายอับดุลอาซิด มามะ">
                    <option value="นายอาหามะ ปูเต๊ะ">
                    <option value="นางสูใบดะห์ มะเซ็ง">
                    <option value="นางนุสนาวาตี อาละ">
                    <option value="นางวานิดา เจ๊ะแม">
                    <option value="นายนัสรูดดีน ยะอิง">
                    <option value="นางนูรูฮูดา ดาราโอ๊ะ">
                    <option value="นางซามีฮะห์ ยะอิง">
                    <option value="นางสาวมีละห์ มะมิง">
                    <option value="นางสาวลาวิณี วาเตะ">
                    <option value="นางสาวนูรฮาฟีซา เปาะแต">
                    <option value="นางสาวซุลฮา สาแล๊ะ">
                    <option value="นางสาวไซหนับ ยูโซ๊ะ">
                    <option value="นางสาวนูรีฮา ยามา">
                    <option value="นางโซเฟีย เย็ง">
                    <option value="นางนิฮาซีมะห์ ซี">
                    <option value="นายมาซีบี สะแวบาโง">
                    <option value="นายอุสมาน สาและ">
                    <option value="นายมามะซักรี หะยีมูซอ">
                    <option value="นางอาอีด๊ะ มะ">
                    <option value="นายซัมรี เจ๊ะแม">
                    <option value="นายเฮง มะดีเยาะ">
                    <option value="นางสาวแอเสาะ ปูตา">
                    <option value="นายวุฒนันท์ เจ๊ะดาโอะ">
                    <option value="นายมรี สะมะแอ">
                    <option value="นายอับดุลเลาะ ดือเร๊ะ">
                    <option value="นางสาวนูรูลฮูดา มะเย็ง">
                    <option value="นายอัลฟินน์ ดาหะแม">
                </datalist>
            </div>

            <!-- ตำแหน่ง -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ตำแหน่ง</label>
                <input list="positionList" name="position" placeholder="เลือกหรือพิมพ์ตำแหน่ง" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                <datalist id="positionList">
                    <option value="รองผู้อำนวยการ">
                    <option value="ครู">
                    <option value="พนักงานราชการ">
                    <option value="ธุรการ">
                    <option value="พี่เลี้ยงเด็กพิการ">
                    <option value="วิทยากรอิสลาม">
                    <option value="รภป.ครู">
                    <option value="ครูโรงเรียนจ้าง">
                </datalist>
            </div>

            <!-- เวลาที่ขอออก -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เวลาที่ขออนุญาตออก</label>
                <input type="time" name="leaveTime" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>

            <!-- เนื่องจาก -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เหตุผลความจำเป็น</label>
                <textarea name="reason" rows="3" placeholder="ระบุเหตุผลที่ต้องการออกก่อนเวลา" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"></textarea>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition transform active:scale-95 flex justify-center items-center">
                <span>ส่งข้อมูลและออกเอกสาร PDF</span>
            </button>
        </form>

        <!-- Status Message & PDF Link Box -->
        <div id="statusContainer" class="hidden p-6 border-t border-gray-100 bg-gray-50 space-y-4">
            <div id="statusBox" class="p-4 rounded-lg text-center font-medium"></div>
            <a id="pdfLink" href="#" target="_blank" 
                class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition transform active:scale-95 flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>เปิดไฟล์ PDF ที่นี่</span>
            </a>
            <button onclick="resetForm()" class="w-full text-blue-600 text-sm font-medium hover:underline text-center block">
                ทำรายการใหม่
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnMsj5uqIvnwEWAaxFPLvu1I_n1X7I5IbZvd-sS_FLEdVrnORXN3BAZiUgrfgWYVNn/exec"; 
        
        // Telegram Config
        const TELEGRAM_TOKEN = "7827929346:AAEbjlVzSa6OJtVyerYk0L2Q2yj_Ybo-6Cc";
        const TELEGRAM_CHAT_ID = "1867755109";

        const form = document.getElementById('leaveForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusContainer = document.getElementById('statusContainer');
        const statusBox = document.getElementById('statusBox');
        const pdfLink = document.getElementById('pdfLink');

        document.getElementById('inputDate').valueAsDate = new Date();

        function formatThaiDate(dateString) {
            const months = [
                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            const date = new Date(dateString);
            const d = date.getDate();
            const m = months[date.getMonth()];
            const y = date.getFullYear() + 543;
            return `${d} ${m} ${y}`;
        }

        async function sendTelegram(data, pdfUrl) {
            const message = `🔔 *มีการขออนุญาตออกก่อนเวลา*\n\n` +
                          `👤 *ชื่อ:* ${data.fullName}\n` +
                          `💼 *ตำแหน่ง:* ${data.position}\n` +
                          `📅 *วันที่:* ${data.thaiDate}\n` +
                          `⏰ *เวลาที่ออก:* ${data.leaveTime} น.\n` +
                          `📝 *เหตุผล:* ${data.reason}\n\n` +
                          `📄 *ลิงก์เอกสาร:* [คลิกเพื่อดูไฟล์ PDF](${pdfUrl})`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {
                console.error("Telegram Error:", err);
            }
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading-spinner"></div>';
            statusContainer.classList.add('hidden');
            pdfLink.classList.add('hidden');

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.thaiDate = formatThaiDate(data.date);

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showStatus("บันทึกข้อมูลสำเร็จและส่งแจ้งเตือนแล้ว!", "success");
                    
                    // เรียกส่ง Telegram จากฝั่ง HTML
                    await sendTelegram(data, result.pdfUrl);

                    if (result.pdfUrl) {
                        pdfLink.href = result.pdfUrl;
                        pdfLink.classList.remove('hidden');
                        window.open(result.pdfUrl, '_blank');
                    }
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showStatus("เกิดข้อผิดพลาด: " + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>ส่งข้อมูลและออกเอกสาร PDF</span>';
            }
        };

        function showStatus(msg, type) {
            statusContainer.classList.remove('hidden');
            statusBox.innerText = msg;
            statusBox.className = `p-4 rounded-lg text-center font-medium ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
        }

        function resetForm() {
            form.reset();
            document.getElementById('inputDate').valueAsDate = new Date();
            statusContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
