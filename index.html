<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขออนุญาตออกก่อนเวลา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .loader {
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top: 3px solid #6366f1;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-600 to-blue-500 p-8 text-white">
            <h1 class="text-3xl font-bold text-center">ระบบขออนุญาตออกก่อนเวลา</h1>
            <p class="text-indigo-100 text-center mt-2 opacity-90">โรงเรียนบ้านดุซงยอ</p>
        </div>

        <form id="leaveForm" class="p-8 space-y-6">
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">ชื่อ-นามสกุล</label>
                        <input type="text" id="employeeName" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="สมชาย ใจดี">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">ตำแหน่ง</label>
                        <input type="text" id="employeePosition" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="ระบุตำแหน่งของคุณ">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">วันที่ต้องการออก</label>
                        <input type="date" id="leaveDate" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">เวลาที่ออก</label>
                        <input type="time" id="leaveTime" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">เนื่องจาก</label>
                    <textarea id="reason" rows="3" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="ระบุสาเหตุความจำเป็น..."></textarea>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center">
                <span id="btnLoader" class="loader hidden mr-3"></span>
                <span id="btnText">ยืนยันและขอรับใบอนุญาต</span>
            </button>
        </form>
    </div>

    <!-- Modal Success -->
    <div id="summaryModal" class="modal-overlay">
        <div class="modal-content text-center">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">ส่งคำขอสำเร็จ!</h2>
            <p class="text-gray-500 mt-2 mb-6">บันทึกข้อมูลเรียบร้อยแล้ว</p>
            
            <div id="summaryDisplay" class="text-left text-sm bg-gray-50 p-4 rounded-xl mb-6 border border-gray-100">
                <!-- Summary Data -->
            </div>
            
            <div class="space-y-3">
                <a id="pdfLink" href="#" target="_blank" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    เปิดไฟล์ใบอนุญาต (PDF)
                </a>
                <button onclick="closeModal()" class="w-full text-gray-400 hover:text-gray-600 font-medium py-2 transition-all">
                    ทำรายการใหม่
                </button>
            </div>
        </div>
    </div>

    <script>
        // *** สำคัญ: ตรวจสอบให้แน่ใจว่า URL นี้มาจาก New Deployment ล่าสุดหลังจากกด Allow Permissions แล้ว ***
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0IYDkK6-dYp5qtDeQOWBr3LXqyY1688PHWoPvOs03x2HSp_ZGbTMEgpwkYXErj1yt/exec";

        function formatThaiDate(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            return new Intl.DateTimeFormat('th-TH', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
            }).format(date);
        }

        document.getElementById('leaveForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            btn.disabled = true;
            btnText.innerText = "กำลังประมวลผลระบบ...";
            btnLoader.classList.remove('hidden');

            const rawDate = document.getElementById('leaveDate').value;
            const thaiDate = formatThaiDate(rawDate);

            const payload = {
                name: document.getElementById('employeeName').value,
                position: document.getElementById('employeePosition').value,
                date: thaiDate,
                time: document.getElementById('leaveTime').value,
                reason: document.getElementById('reason').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    throw new Error("HTTP error! status: " + response.status);
                }

                const result = await response.json();

                if (result.status === "success") {
                    document.getElementById('summaryDisplay').innerHTML = `
                        <div class="grid grid-cols-3 gap-1">
                            <span class="text-gray-400">พนักงาน:</span>
                            <span class="col-span-2 font-medium">${payload.name}</span>
                            <span class="text-gray-400">ตำแหน่ง:</span>
                            <span class="col-span-2 font-medium">${payload.position}</span>
                            <span class="text-gray-400">วันที่:</span>
                            <span class="col-span-2 font-medium">${payload.date}</span>
                            <span class="text-gray-400">เวลา:</span>
                            <span class="col-span-2 font-medium">${payload.time} น.</span>
                        </div>
                    `;
                    document.getElementById('pdfLink').href = result.pdfUrl;
                    document.getElementById('summaryModal').style.display = 'flex';
                } else {
                    throw new Error(result.message || "Unknown error from server");
                }

            } catch (error) {
                console.error("Submission Error Details:", error);
                
                let errorMessage = "เกิดปัญหาในการเชื่อมต่อ: " + error.message;
                
                if (error.message.includes("external_request") || error.message.includes("อนุญาต") || error.message.includes("permission")) {
                    errorMessage = "❌ ข้อผิดพลาดด้านสิทธิ์ (Authorization):\n\nโปรดไปที่ Google Apps Script แล้วกดปุ่ม Run ฟังก์ชันใดก็ได้ เพื่อให้หน้าต่าง 'Allow Access' ปรากฏขึ้นมาให้กดยืนยันครับ";
                }
                
                alert(errorMessage);
            } finally {
                btn.disabled = false;
                btnText.innerText = "ยืนยันและขอรับใบอนุญาต";
                btnLoader.classList.add('hidden');
            }
        });

        function closeModal() {
            document.getElementById('summaryModal').style.display = 'none';
            document.getElementById('leaveForm').reset();
        }
    </script>
</body>
</html>
